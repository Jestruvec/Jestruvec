<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jestruvec</title>
    <link rel="icon" type="image/svg+xml" href="/tesseract.png" />
    <style>
      body {
        background-color: black;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      body.loaded {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app" class="h-screen w-full relative overflow-hidden">
      <header class="fixed top-0 w-full">
        <nav class="flex items-center justify-between py-3 px-6">
          <div class="flex gap-2 items-center">
            <h1 data-i18n="title" class="font-bold text-gray-800 text-2xl"></h1>
            <button
              id="lang-switcher"
              class="px-2 py-1 cursor-pointer uppercase font-bold"
              aria-label="Change lang"
            >
              🌐 <span data-i18n="lang"></span>
            </button>
          </div>

          <ul class="flex gap-4 text-gray-600">
            <li class="hidden sm:block">
              <button
                id="play-button"
                data-i18n="nav.play"
                class="cursor-pointer hover:text-gray-900 transition-colors focus:outline-none"
              ></button>
            </li>
            <li>
              <button
                id="about-button"
                data-i18n="nav.about"
                class="cursor-pointer hover:text-gray-900 transition-colors focus:outline-none font-bold"
              ></button>
            </li>
            <li>
              <button
                id="projects-button"
                data-i18n="nav.projects"
                class="cursor-pointer hover:text-gray-900 transition-colors focus:outline-none"
              ></button>
            </li>
            <li>
              <button
                id="contact-button"
                data-i18n="nav.contact"
                class="cursor-pointer hover:text-gray-900 transition-colors focus:outline-none"
              ></button>
            </li>
          </ul>
        </nav>
      </header>

      <canvas id="canvas"></canvas>

      <div
        id="dialog"
        class="w-96 sm:w-120 h-[75vh] flex flex-col justify-between items-center text-white text-center p-6 fixed top-1/2 left-1/2 rounded-lg transition-all ease-in-out duration-300 show transform translate-x-[-50%] translate-y-[-50%]"
      >
        <section id="about-section" class="flex flex-col flex-grow mb-4">
          <h2 class="text-2xl font-bold" data-i18n="about.title"></h2>

          <img
            src="images/selfie-circle.webp"
            alt="Photo of Jhonny"
            data-i18n="about.imgAlt"
            class="rounded-full m-auto w-32 h-32 object-cover shadow-md"
          />

          <div class="flex flex-col gap-4 overflow-auto mb-4 h-[50%]">
            <p data-i18n="about.p1"></p>
            <p data-i18n="about.p2"></p>
            <p data-i18n="about.p3"></p>
          </div>

          <a
            href="https://drive.google.com/drive/folders/1ibrxFaLtx6o35RmAspa_ejJZhlBu1xkG?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="about.resume"
            class="cursor-pointer"
          >
          </a>
        </section>

        <section
          id="projects-section"
          class="hidden flex-col gap-4 mb-4 flex-grow overflow-auto"
        >
          <h2 class="text-2xl font-bold mb-4" data-i18n="projects.title"></h2>

          <div class="flex flex-col gap-8 h-full overflow-auto">
            <project-card
              title-i18n-key="projects.cursed_waters.title"
              description-i18n-key="projects.cursed_waters.description"
              img-url="images/cursed-waters.webp"
              img-alt="Cursed Waters Screenshot"
              img-i18n-alt-key="projects.cursed_waters.img_alt"
              technologies-i18n-key="projects.cursed_waters.technologies"
              repo-url="https://github.com/Jestruvec/cursed-waters/"
              live-url="https://jestruvec.github.io/cursed-waters/"
            ></project-card>

            <project-card
              title-i18n-key="projects.tesseract.title"
              description-i18n-key="projects.tesseract.description"
              img-url="images/tesseract.webp"
              img-alt="Tesseract Screenshot"
              img-i18n-alt-key="projects.tesseract.img_alt"
              technologies-i18n-key="projects.tesseract.technologies"
              repo-url="https://github.com/Jestruvec/tesseract/"
              live-url="https://jestruvec.github.io/tesseract/"
            ></project-card>

            <project-card
              title-i18n-key="projects.dictionary.title"
              description-i18n-key="projects.dictionary.description"
              img-url="images/dictionary.webp"
              img-alt="Cursed Waters Screenshot"
              img-i18n-alt-key="projects.dictionary.img_alt"
              technologies-i18n-key="projects.dictionary.technologies"
              repo-url="https://github.com/Jestruvec/dictionary/"
              live-url="https://dictionary-blush-five.vercel.app/"
            ></project-card>

            <project-card
              title-i18n-key="projects.pokemons.title"
              description-i18n-key="projects.pokemons.description"
              img-url="images/pokemons.webp"
              img-alt="Cursed Waters Screenshot"
              img-i18n-alt-key="projects.pokemons.img_alt"
              technologies-i18n-key="projects.pokemons.technologies"
              repo-url="https://github.com/Jestruvec/pokemons/"
              live-url="https://jestruvec.github.io/pokemons/"
            ></project-card>

            <project-card
              title-i18n-key="projects.my_crossy_road_game.title"
              description-i18n-key="projects.my_crossy_road_game.description"
              img-url="images/my-crossy-road-game.webp"
              img-alt="Cursed Waters Screenshot"
              img-i18n-alt-key="projects.my_crossy_road_game.img_alt"
              technologies-i18n-key="projects.my_crossy_road_game.technologies"
              repo-url="https://github.com/Jestruvec/my-crossy-road-game/"
              live-url="https://jestruvec.github.io/my-crossy-road-game/"
            ></project-card>

            <project-card
              title-i18n-key="projects.strength_lab.title"
              description-i18n-key="projects.strength_lab.description"
              img-url="images/strength-lab.webp"
              img-alt="Cursed Waters Screenshot"
              img-i18n-alt-key="projects.strength_lab.img_alt"
              technologies-i18n-key="projects.strength_lab.technologies"
              repo-url="https://github.com/Jestruvec/strength-lab/"
              live-url="https://jestruvec.github.io/strength-lab/"
            ></project-card>
          </div>
        </section>

        <section
          id="contact-section"
          class="hidden flex-col justify-between items-center gap-6 mb-4 h-full"
        >
          <h2 class="text-2xl font-bold mb-4" data-i18n="contact.title"></h2>

          <p data-i18n="contact.description"></p>

          <form
            id="contact-form"
            class="flex flex-col gap-4 mt-4 w-full text-left h-full overflow-auto"
          >
            <span
              id="form-contact-success-message"
              data-i18n="contact.success"
              class="text-green-500 font-bold hidden text-center transition-all ease-in-out duration-300"
            ></span>
            <div class="w-full flex flex-col">
              <label
                html-for="user_name"
                data-i18n="contact.label.name"
              ></label>
              <input
                id="user_name"
                name="user_name"
                type="text"
                placeholder="Your Name"
                data-i18n="contact.placeholder.name"
                class="p-3 rounded-md bg-gray-800 text-white focus:outline-none focus:ring-0"
              />
              <span
                id="form-contact-name-error"
                data-i18n="contact.error.name"
                class="text-red-500 text-sm hidden"
              ></span>
            </div>

            <div class="w-full flex flex-col">
              <label
                html-for="user_email"
                data-i18n="contact.label.email"
              ></label>
              <input
                id="user_email"
                name="user_email"
                type="text"
                placeholder="Your Email"
                data-i18n="contact.placeholder.email"
                class="p-3 rounded-md bg-gray-800 text-white focus:outline-none focus:ring-0"
              />
              <span
                id="form-contact-email-error"
                data-i18n="contact.error.email"
                class="text-red-500 text-sm hidden"
              ></span>
            </div>

            <div class="w-full flex flex-col">
              <label
                html-for="message"
                data-i18n="contact.label.message"
              ></label>
              <textarea
                id="message"
                name="message"
                placeholder="Your Message"
                data-i18n="contact.placeholder.message"
                rows="4"
                class="p-3 rounded-md bg-gray-800 text-white focus:outline-none focus:ring-0"
              ></textarea>
              <span
                id="form-contact-message-error"
                data-i18n="contact.error.message"
                class="text-red-500 text-sm hidden"
              ></span>
            </div>

            <span
              id="form-contact-error"
              data-i18n="contact.error.form"
              class="text-red-500 text-sm hidden"
            >
            </span>

            <button
              id="form-contact-submit-btn"
              data-i18n="contact.submit"
              type="submit"
              class="bg-gray-600 cursor-pointer hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-md transition-all"
            ></button>
          </form>

          <div class="text-sm mt-4">
            <span data-i18n="contact.directly"></span>
            <a
              href="mailto:jhonnyestruve@gmail.com"
              class="underline"
              data-i18n="contact.my_email"
            >
            </a>
          </div>
        </section>

        <footer>
          <button
            id="close-dialog-button"
            data-i18n="close"
            class="cursor-pointer text-white py-2 px-4 transition-all ease-in-out duration-500 hover:text-red-500 focus:outline-none"
          ></button>
        </footer>
      </div>

      <div id="joystick-container" class="sm:hidden">
        <div id="joystick"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("loaded");
      });
    </script>
  </body>
</html>
