<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jestruvec</title>
    <link rel="icon" type="image/svg+xml" href="/Jestruvec/tesseract.png" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      body.loaded {
        opacity: 1;
      }
    </style>
    <script type="module" crossorigin src="/Jestruvec/assets/index-DywZg63m.js"></script>
    <link rel="stylesheet" crossorigin href="/Jestruvec/assets/index-DL0qAfPy.css">
  </head>
  <body>
    <div id="app" class="h-screen w-full relative overflow-hidden">
      <canvas id="canvas"></canvas>

      <div id="joystick-container" class="sm:hidden">
        <div id="joystick"></div>
      </div>

      <div class="fixed inset-0">
        <div
          id="layout"
          class="w-full h-[100dvh] max-w-7xl m-auto flex flex-col px-6"
        >
          <header class="flex items-center justify-between h-16 shrink-0">
            <div class="flex gap-2 items-center">
              <h1
                data-i18n="title"
                class="font-semibold text-xl md:text-2xl"
              ></h1>

              <button
                id="lang-switcher"
                aria-label="Change lang"
                class="cursor-pointer font-semibold hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2 hidden md:block"
              >
                🌐 <span data-i18n="lang"></span>
              </button>
            </div>

            <nav>
              <ul class="flex">
                <li class="text-sm md:text-base">
                  <button
                    id="play-button"
                    data-i18n="nav.play"
                    class="cursor-pointer font-semibold hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2"
                  ></button>
                </li>
                <li class="text-sm md:text-base">
                  <button
                    id="about-button"
                    data-i18n="nav.about"
                    class="cursor-pointer font-semibold hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2"
                  ></button>
                </li>
                <li class="text-sm md:text-base">
                  <button
                    id="projects-button"
                    data-i18n="nav.projects"
                    class="cursor-pointer font-semibold hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2"
                  ></button>
                </li>
                <li class="text-sm md:text-base">
                  <button
                    id="contact-button"
                    data-i18n="nav.contact"
                    class="cursor-pointer font-semibold hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2"
                  ></button>
                </li>
              </ul>
            </nav>
          </header>

          <main id="main-content" class="flex-grow overflow-auto py-10 show">
            <section id="about-section" class="flex flex-col gap-4 h-full">
              <h1 class="text-2xl font-bold" data-i18n="about.title"></h1>

              <img
                src="/Jestruvec/images/selfie-circle.webp"
                alt="Jhonny selfie"
                class="my-10 w-40 h-40 bg-center bg-cover mx-auto"
              />

              <div class="max-w-lg space-y-4 mx-auto">
                <p data-i18n="about.p1" class="text-center"></p>
                <p data-i18n="about.p2" class="text-center"></p>
                <p data-i18n="about.p3" class="text-center"></p>
              </div>
            </section>

            <section
              id="projects-section"
              class="hidden flex-col gap-4 h-full overflow-auto"
            >
              <h1 class="text-2xl font-bold" data-i18n="projects.title"></h1>

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <project-card
                  title-i18n-key="projects.cursed_waters.title"
                  description-i18n-key="projects.cursed_waters.description"
                  img-url="images/cursed-waters.webp"
                  img-alt="Cursed Waters Screenshot"
                  img-i18n-alt-key="projects.cursed_waters.img_alt"
                  technologies-i18n-key="projects.cursed_waters.technologies"
                  repo-url="https://github.com/Jestruvec/cursed-waters/"
                  live-url="https://jestruvec.github.io/cursed-waters/"
                ></project-card>

                <project-card
                  title-i18n-key="projects.tesseract.title"
                  description-i18n-key="projects.tesseract.description"
                  img-url="images/tesseract.webp"
                  img-alt="Tesseract Screenshot"
                  img-i18n-alt-key="projects.tesseract.img_alt"
                  technologies-i18n-key="projects.tesseract.technologies"
                  repo-url="https://github.com/Jestruvec/tesseract/"
                  live-url="https://jestruvec.github.io/tesseract/"
                ></project-card>

                <project-card
                  title-i18n-key="projects.dictionary.title"
                  description-i18n-key="projects.dictionary.description"
                  img-url="images/dictionary.webp"
                  img-alt="Cursed Waters Screenshot"
                  img-i18n-alt-key="projects.dictionary.img_alt"
                  technologies-i18n-key="projects.dictionary.technologies"
                  repo-url="https://github.com/Jestruvec/dictionary/"
                  live-url="https://dictionary-blush-five.vercel.app/"
                ></project-card>

                <project-card
                  title-i18n-key="projects.pokemons.title"
                  description-i18n-key="projects.pokemons.description"
                  img-url="images/pokemons.webp"
                  img-alt="Cursed Waters Screenshot"
                  img-i18n-alt-key="projects.pokemons.img_alt"
                  technologies-i18n-key="projects.pokemons.technologies"
                  repo-url="https://github.com/Jestruvec/pokemons/"
                  live-url="https://jestruvec.github.io/pokemons/"
                ></project-card>

                <project-card
                  title-i18n-key="projects.my_crossy_road_game.title"
                  description-i18n-key="projects.my_crossy_road_game.description"
                  img-url="images/my-crossy-road-game.webp"
                  img-alt="Cursed Waters Screenshot"
                  img-i18n-alt-key="projects.my_crossy_road_game.img_alt"
                  technologies-i18n-key="projects.my_crossy_road_game.technologies"
                  repo-url="https://github.com/Jestruvec/my-crossy-road-game/"
                  live-url="https://jestruvec.github.io/my-crossy-road-game/"
                ></project-card>

                <project-card
                  title-i18n-key="projects.strength_lab.title"
                  description-i18n-key="projects.strength_lab.description"
                  img-url="images/strength-lab.webp"
                  img-alt="Cursed Waters Screenshot"
                  img-i18n-alt-key="projects.strength_lab.img_alt"
                  technologies-i18n-key="projects.strength_lab.technologies"
                  repo-url="https://github.com/Jestruvec/strength-lab/"
                  live-url="https://jestruvec.github.io/strength-lab/"
                ></project-card>
              </div>
            </section>

            <section
              id="contact-section"
              class="hidden flex-col gap-4 h-full justify-center items-center"
            >
              <h1 class="text-2xl font-bold" data-i18n="contact.title"></h1>
              <p data-i18n="contact.description"></p>

              <form
                id="contact-form"
                class="flex flex-col gap-4 w-full max-w-md"
              >
                <span
                  id="form-contact-success-message"
                  data-i18n="contact.success"
                  class="text-green-500 font-bold hidden text-center transition-all ease-in-out duration-300"
                ></span>

                <span
                  id="form-contact-error"
                  data-i18n="contact.error.form"
                  class="text-red-500 text-sm hidden"
                >
                </span>

                <div class="w-full flex flex-col">
                  <label
                    html-for="user_name"
                    data-i18n="contact.label.name"
                  ></label>
                  <input
                    id="user_name"
                    name="user_name"
                    type="text"
                    placeholder="Your Name"
                    data-i18n="contact.placeholder.name"
                    class="p-2 rounded-lg border border-gray-800 focus:outline-none focus:ring-1"
                  />
                  <span
                    id="form-contact-name-error"
                    data-i18n="contact.error.name"
                    class="text-red-500 text-sm hidden"
                  ></span>
                </div>

                <div class="w-full flex flex-col">
                  <label
                    html-for="user_email"
                    data-i18n="contact.label.email"
                  ></label>
                  <input
                    id="user_email"
                    name="user_email"
                    type="text"
                    placeholder="Your Email"
                    data-i18n="contact.placeholder.email"
                    class="p-2 rounded-lg border border-gray-800 focus:outline-none focus:ring-1"
                  />
                  <span
                    id="form-contact-email-error"
                    data-i18n="contact.error.email"
                    class="text-red-500 text-sm hidden"
                  ></span>
                </div>

                <div class="w-full flex flex-col">
                  <label
                    html-for="message"
                    data-i18n="contact.label.message"
                  ></label>
                  <textarea
                    id="message"
                    name="message"
                    placeholder="Your Message"
                    data-i18n="contact.placeholder.message"
                    rows="4"
                    class="p-2 rounded-lg border border-gray-800 focus:outline-none focus:ring-1"
                  ></textarea>
                  <span
                    id="form-contact-message-error"
                    data-i18n="contact.error.message"
                    class="text-red-500 text-sm hidden"
                  ></span>
                </div>

                <button
                  id="form-contact-submit-btn"
                  type="submit"
                  data-i18n="contact.submit"
                  class="cursor-pointer hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2 border font-semibold"
                ></button>
              </form>

              <div class="text-center">
                <span data-i18n="contact.directly"></span>
                <a
                  href="mailto:jhonnyestruve@gmail.com"
                  class="cursor-pointer hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2"
                  data-i18n="contact.my_email"
                >
                </a>
              </div>
            </section>
          </main>

          <footer class="h-16 shrink-0 flex items-center gap-4">
            <a
              href="https://www.linkedin.com/in/jhonny-estruve-35ba4b1b2/"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="linkedin"
              class="cursor-pointer font-semibold hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2"
            >
            </a>
            <a
              href="https://github.com/Jestruvec"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="github"
              class="cursor-pointer font-semibold hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2"
            >
            </a>
            <a
              href="https://drive.google.com/drive/folders/1ibrxFaLtx6o35RmAspa_ejJZhlBu1xkG?usp=sharing"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="resume"
              class="cursor-pointer font-semibold self-center hover:bg-[rgba(0,0,0,0.05)] focus:outline-none focus:ring rounded-lg py-1 px-2"
            >
            </a>
          </footer>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("loaded");
      });
    </script>
  </body>
</html>
